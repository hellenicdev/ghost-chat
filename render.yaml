services:
  - type: web
    name: ghost-chat
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node src/index.js
    envVars:
      - key: PORT
        value: "3001"
      - key: CLIENT_ORIGIN
        value: https://hellenicdev.eu
      - key: MESSAGE_TTL_HOURS
        value: "24"
      - key: MESSAGE_CLEANUP_INTERVAL_MS
        value: "600000"
      - key: NODE_VERSION
        value: "20"
