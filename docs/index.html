<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostChat</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #030712;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; }
    h1 {
      font-size: 3rem;
      background: linear-gradient(to right, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p { color: #6b7280; margin-top: 0.5rem; }
    .loader { margin: 2rem auto; width: 40px; height: 40px; border: 3px solid #1f2937; border-top-color: #818cf8; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #818cf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GhostChat</h1>
    <p>Anonymous real-time chat</p>
    <div class="loader"></div>
    <p style="margin-top:2rem;font-size:0.875rem">
      The client app runs locally at<br>
      <a href="http://localhost:5173">http://localhost:5173</a>
    </p>
  </div>
</body>
</html>
